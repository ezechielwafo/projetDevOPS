spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/usersdb?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8081